# =====================================================================
#  MiMascota - Configuración de Redis
#  La contraseña se pasa con --requirepass desde docker-compose.yml.
# =====================================================================
bind 0.0.0.0
port 6379

# Persistencia (AOF) para no perder datos al reiniciar el contenedor
appendonly yes
appendfsync everysec

# Límite de memoria: las claves de caché se expulsan con LRU
maxmemory 256mb
maxmemory-policy allkeys-lru

# Los mensajes Pub/Sub no se almacenan; solo se entregan a suscriptores activos.
