# =====================================================================
#  MiMascota - Orquestación de servicios (entorno de desarrollo)
#  Uso: docker compose up -d --build
# =====================================================================
name: mimascota

# Configuración común para los 3 nodos del replica set de MongoDB
x-mongo-node: &mongo-node
  image: mongo:7.0
  restart: unless-stopped
  command: ["mongod", "--replSet", "${MONGO_REPLICA_SET_NAME:-rs0}", "--bind_ip_all"]
  networks: [mimascota-net]
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  # ---------------- PostgreSQL: datos relacionales ----------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mimascota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-mimascota}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # schema.sql se ejecuta solo la primera vez (volumen vacío)
      - ./database/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [mimascota-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- MongoDB: replica set de 3 nodos ----------------
  mongo1:
    <<: *mongo-node
    hostname: mongo1
    ports:
      - "27017:27017"
    volumes:
      - mongo1-data:/data/db

  mongo2:
    <<: *mongo-node
    hostname: mongo2
    ports:
      - "27018:27017"
    volumes:
      - mongo2-data:/data/db

  mongo3:
    <<: *mongo-node
    hostname: mongo3
    ports:
      - "27019:27017"
    volumes:
      - mongo3-data:/data/db

  # Servicio de un solo uso: inicia el replica set y crea las
  # colecciones con validación $jsonSchema e índices (idempotente).
  mongo-setup:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongo1: { condition: service_healthy }
      mongo2: { condition: service_healthy }
      mongo3: { condition: service_healthy }
    environment:
      MONGO_REPLICA_SET_NAME: ${MONGO_REPLICA_SET_NAME:-rs0}
      MONGO_DB: ${MONGO_DB:-mimascota}
    volumes:
      - ./database/mongo:/scripts:ro
    entrypoint: ["bash", "/scripts/replica-set/init-replica.sh"]
    networks: [mimascota-net]

  # ---------------- Redis: caché y Pub/Sub ----------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./database/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    networks: [mimascota-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- Backend: FastAPI ----------------
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Sobrescribe los hosts de .env para usar la red interna de Docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=${MONGO_REPLICA_SET_NAME:-rs0}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo-setup: { condition: service_completed_successfully }
    networks: [mimascota-net]

  # ---------------- Frontend: React + Vite ----------------
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      # Necesario para recarga en caliente con volúmenes en Windows/macOS
      VITE_USE_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks: [mimascota-net]

networks:
  mimascota-net:
    driver: bridge

volumes:
  postgres-data:
  mongo1-data:
  mongo2-data:
  mongo3-data:
  redis-data:
