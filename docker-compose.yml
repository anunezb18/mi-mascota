# =====================================================================
#  MiMascota - Orquestación de servicios (entorno de desarrollo)
#  Uso: docker compose up -d --build
# =====================================================================
name: mimascota

# Configuración común para los 3 nodos del replica set de MongoDB
x-mongo-node: &mongo-node
  image: mongo:7.0
  restart: unless-stopped
  command: ["mongod", "--replSet", "${MONGO_REPLICA_SET_NAME:-rs0}", "--bind_ip_all"]
  networks: [mimascota-net]
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  # ---------------- MongoDB: replica set de 3 nodos ----------------
  mongo1:
    <<: *mongo-node
    hostname: mongo1
    ports:
      - "27017:27017"
    volumes:
      - mongo1-data:/data/db

  mongo2:
    <<: *mongo-node
    hostname: mongo2
    ports:
      - "27018:27017"
    volumes:
      - mongo2-data:/data/db

  mongo3:
    <<: *mongo-node
    hostname: mongo3
    ports:
      - "27019:27017"
    volumes:
      - mongo3-data:/data/db

  # Servicio de un solo uso: inicia el replica set y crea las colecciones
  # con validación $jsonSchema, los índices (2dsphere, únicos, texto) y,
  # opcionalmente, los datos de demostración. Debe ser idempotente.
  # El replica set es obligatorio: lo exigen los change streams (notificaciones
  # en tiempo real) y las transacciones multi-documento (aprobar una solicitud).
  mongo-setup:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongo1: { condition: service_healthy }
      mongo2: { condition: service_healthy }
      mongo3: { condition: service_healthy }
    environment:
      MONGO_REPLICA_SET_NAME: ${MONGO_REPLICA_SET_NAME:-rs0}
      MONGO_DB: ${MONGO_DB:-mimascota}
    volumes:
      - ./database/mongo:/scripts:ro
    entrypoint: ["bash", "/scripts/replica-set/init-replica.sh"]
    networks: [mimascota-net]

  # ---------------- Backend: FastAPI ----------------
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Sobrescribe la URI de .env para usar la red interna de Docker
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=${MONGO_REPLICA_SET_NAME:-rs0}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mongo-setup: { condition: service_completed_successfully }
    networks: [mimascota-net]

  # ---------------- Frontend: React + Vite ----------------
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws/notificaciones}
      VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
      # Necesario para recarga en caliente con volúmenes en Windows/macOS
      VITE_USE_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks: [mimascota-net]

networks:
  mimascota-net:
    driver: bridge

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
